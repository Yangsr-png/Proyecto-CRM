<div class="bg-white rounded-3xl p-8 shadow-sm min-h-[calc(100vh-4rem)]">
  
  <h2 class="text-2xl font-bold text-slate-800 mb-6">Resumen General</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
    
    <div class="flex flex-col items-center">
      <h3 class="text-slate-500 font-bold text-sm mb-2">Comunidades Activas</h3>
      <div class="flex items-center gap-4">
        <span class="text-5xl font-bold text-[#1A2332]">{{ kpis().comunidadesActivas }}</span>
        <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center"></div>
      </div>
    </div>

    <div class="flex flex-col items-center border-l border-r border-slate-100">
      <h3 class="text-slate-500 font-bold text-sm mb-2">Incidencias Pendientes</h3>
      <div class="flex items-center gap-4">
        <span class="text-5xl font-bold text-red-600">{{ kpis().incidenciasPendientes }}</span>
        <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center"></div>
      </div>
    </div>

    <div class="flex flex-col items-center">
      <h3 class="text-slate-500 font-bold text-sm mb-2">Tareas Completadas</h3>
      <div class="flex items-center gap-4">
        <span class="text-5xl font-bold text-green-500">{{ kpis().tareasCompletadas }}</span>
        <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center"></div>
      </div>
    </div>

  </div>

  <div class="w-full mt-12 px-4">
    <div class="relative bg-white border border-slate-200 rounded-3xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
      <h4 class="absolute top-6 left-8 text-slate-200 text-lg font-bold">Incidencias por Mes</h4>
      <div class="h-[350px] w-full mt-6">
        <canvas baseChart
          [data]="barChartData"
          [options]="barChartOptions"
          [type]="barChartType">
        </canvas>
      </div>
    </div>
  </div>

</div>
