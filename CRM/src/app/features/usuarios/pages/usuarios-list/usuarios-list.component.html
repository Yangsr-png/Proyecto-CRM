<div class="space-y-8 pb-10">

  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Equipo & Usuarios</h2>
      <p class="text-slate-500 text-sm mt-1">Gestiona el acceso y roles del personal.</p>
    </div>
    
    <button (click)="abrirModal()" class="bg-[#1e293b] hover:bg-slate-800 text-white px-5 py-2.5 rounded-xl font-bold shadow-lg shadow-slate-300 transition-all flex items-center gap-2 cursor-pointer">
      <span class="material-icons text-sm">person_add</span> 
      <span class="hidden sm:inline">Nuevo Usuario</span>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">

    @for (user of usuarios(); track user.id) {
      <div class="group bg-white rounded-3xl p-6 border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative">
        
        <div class="absolute top-5 right-5 flex items-center gap-1.5 bg-slate-50 px-2 py-1 rounded-lg border border-slate-100">
          <span class="w-2 h-2 rounded-full" [ngClass]="user.activo !== false ? 'bg-green-500' : 'bg-red-400'"></span>
        </div>

        <div class="flex flex-col items-center text-center mt-4">
          
          <div class="w-20 h-20 rounded-full mb-4 flex items-center justify-center text-2xl font-bold border-4 border-slate-50 shadow-sm transition-transform group-hover:scale-105"
               [ngClass]="user.role === 'ADMIN' ? 'bg-purple-100 text-purple-600' : 'bg-blue-100 text-blue-600'">
            {{ getIniciales(user.nombre) }}
          </div>
          
          <h3 class="font-bold text-lg text-slate-800">
            {{ user.nombre }}
          </h3>
          
          <span class="mt-2 px-3 py-1 rounded-full text-xs font-bold border" [ngClass]="getRolClass(user.role)">
            {{ user.role }}
          </span>

          <div class="w-full border-t border-slate-50 my-5"></div>

          <div class="w-full space-y-3 text-left">
            <div class="flex items-center gap-3 text-sm text-slate-600 bg-slate-50 p-2 rounded-lg">
              <span class="material-icons text-slate-400 text-[18px]">email</span>
              <span class="truncate" title="{{user.email}}">{{ user.email }}</span>
            </div>
          </div>

          <button (click)="verPerfil(user)" class="mt-6 w-full py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-bold text-sm transition-colors flex items-center justify-center gap-2">
            <span class="material-icons text-sm">visibility</span> Ver Perfil
          </button>

        </div>
      </div>
    }

  </div>
  
  @if (modalAbierto()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm" (click)="cerrarModal()">
      <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all" (click)="$event.stopPropagation()">
        
        <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
          <h3 class="text-xl font-bold text-slate-800">Nuevo Usuario</h3>
          <button (click)="cerrarModal()" class="text-slate-400 hover:text-red-500"><span class="material-icons">close</span></button>
        </div>

        <div class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Completo</label>
            <input [(ngModel)]="nuevoUsuario.nombre" type="text" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-blue-500">
          </div>
          
          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
            <input [(ngModel)]="nuevoUsuario.email" type="email" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Contraseña</label>
            <input [(ngModel)]="nuevoUsuario.password" type="password" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-blue-500">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Rol</label>
            <select [(ngModel)]="nuevoUsuario.role" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 outline-none focus:border-blue-500">
              <option value="TECNICO">Técnico</option>
              <option value="ADMIN">Administrador</option>
            </select>
          </div>

          <button (click)="guardar()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition shadow-lg mt-4">
            Crear Usuario
          </button>
        </div>
      </div>
    </div>
  }

</div>
