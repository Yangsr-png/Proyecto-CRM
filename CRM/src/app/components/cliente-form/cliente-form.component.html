<form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-5">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre Empresa</label>
      <input type="text" formControlName="nombre" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Ej: Tech Solutions SL">
      @if (form.controls.nombre.hasError('required') && form.controls.nombre.touched) { <p class="text-red-500 text-xs mt-1">Requerido</p> }
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">CIF</label>
      <input type="text" formControlName="cif" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="B12345678">
      @if (form.controls.cif.hasError('pattern') && form.controls.cif.touched) { <p class="text-red-500 text-xs mt-1">Formato inválido</p> }
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
      <input type="email" formControlName="email" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
    </div>
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Teléfono</label>
      <input type="tel" formControlName="telefono" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm">
    </div>
  </div>

  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Dirección</label>
    <input type="text" formControlName="direccion" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm" placeholder="Av. Principal 123">
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button type="button" (click)="cancelar()" class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg text-sm hover:bg-slate-50">Cancelar</button>
    <button type="submit" [disabled]="form.invalid || isSubmitting" class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 disabled:bg-slate-300">
      {{ isSubmitting ? 'Guardando...' : 'Crear Cliente' }}
    </button>
  </div>
</form>
