<form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-5">
  
  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Título de la Tarea</label>
    <input type="text" formControlName="titulo" placeholder="Ej: Mantenimiento aire acondicionado"
           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm transition-all">
    @if (form.get('titulo')?.hasError('required') && form.get('titulo')?.touched) {
      <p class="text-red-500 text-xs mt-1">El título es obligatorio.</p>
    }
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Vencimiento</label>
      <input type="date" formControlName="fechaVencimiento" 
             class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm text-slate-600">
    </div>
    
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Cliente Asignado</label>
      <div class="relative">
        <select formControlName="clienteId" 
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white appearance-none cursor-pointer">
          <option [ngValue]="null" disabled>Seleccionar...</option>
          @for (c of clientes(); track c.id) {
            <option [value]="c.id">{{ c.nombre }}</option>
          }
        </select>
        <span class="material-icons absolute right-3 top-2.5 text-slate-400 text-lg pointer-events-none">expand_more</span>
      </div>
    </div>
  </div>

  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Descripción</label>
    <textarea formControlName="descripcion" rows="3" placeholder="Detalles adicionales..."
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-sm resize-none"></textarea>
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button type="button" (click)="cancelar()" 
            class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg text-sm font-medium transition-colors">
      Cancelar
    </button>
    <button type="submit" [disabled]="form.invalid || isSubmitting"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-md hover:bg-blue-700 disabled:bg-slate-300 transition-all">
      {{ isSubmitting ? 'Guardando...' : 'Crear Tarea' }}
    </button>
  </div>
</form>
