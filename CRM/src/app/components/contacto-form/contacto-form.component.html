<form [formGroup]="form" (ngSubmit)="guardar()" class="space-y-5">
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nombre</label>
      <input 
        type="text" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-slate-400"
        formControlName="nombre" 
        placeholder="Ej: Ana"
      >
      @if (form.controls.nombre.hasError('required') && form.controls.nombre.touched) {
        <p class="text-red-500 text-xs mt-1">Requerido</p>
      }
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Apellido</label>
      <input 
        type="text" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-slate-400"
        formControlName="apellido" 
        placeholder="Ej: García"
      >
      @if (form.controls.apellido.hasError('required') && form.controls.apellido.touched) {
        <p class="text-red-500 text-xs mt-1">Requerido</p>
      }
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
    
    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email</label>
      <input 
        type="email" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-slate-400"
        formControlName="email" 
        placeholder="correo@ejemplo.com"
      >
      @if (form.controls.email.hasError('email') && form.controls.email.touched) {
        <p class="text-red-500 text-xs mt-1">Email inválido</p>
      }
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Teléfono</label>
      <input 
        type="tel" 
        class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-slate-400"
        formControlName="telefono" 
        placeholder="600..."
      >
    </div>
  </div>

  <div>
    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Cargo</label>
    <input 
      type="text" 
      class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm placeholder-slate-400"
      formControlName="cargo" 
      placeholder="Ej: Director Comercial"
    >
  </div>

  <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
    <button 
      type="button" 
      class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium text-sm transition-colors"
      (click)="cancelar()"
    >
      Cancelar
    </button>
    <button 
      type="submit" 
      class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-bold text-sm shadow-md transition-colors disabled:bg-slate-300 disabled:cursor-not-allowed"
      [disabled]="form.invalid || isSubmitting"
    >
      {{ isSubmitting ? 'Guardando...' : 'Guardar Contacto' }}
    </button>
  </div>
</form>
