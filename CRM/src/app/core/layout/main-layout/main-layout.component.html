<div class="flex min-h-screen bg-slate-100 font-sans">

  <aside class="w-64 bg-[#1A2332] text-white flex-shrink-0 hidden md:flex md:flex-col fixed h-full z-20">
    
    <div class="h-20 flex items-center px-6 border-b border-slate-700/50">
      <h1 class="text-lg font-bold leading-tight tracking-wide">
        MANTENIMIENTOS <br> <span class="text-slate-300">EXPRESS</span>
      </h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      
      <a routerLink="/dashboard" 
         routerLinkActive="bg-[#2A3445] text-white border-l-4 border-blue-500 shadow-sm"
         [routerLinkActiveOptions]="{exact: true}"
         class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-r-lg transition-colors border-l-4 border-transparent">
        <span class="material-icons text-sm">dashboard</span>
        <span class="font-medium text-sm">Dashboard</span>
      </a>

      <a routerLink="/clientes" 
         routerLinkActive="bg-[#2A3445] text-white border-l-4 border-blue-500 shadow-sm"
         class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-r-lg transition-colors border-l-4 border-transparent">
        <span class="material-icons text-sm">people</span>
        <span class="font-medium text-sm">Clientes</span>
      </a>

      <a routerLink="/dashboard/incidencias" 
         routerLinkActive="bg-[#2A3445] text-white border-l-4 border-blue-500 shadow-sm"
         class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-r-lg transition-colors border-l-4 border-transparent">
        <span class="material-icons text-sm">warning</span>
        <span class="font-medium text-sm">Incidencias</span>
      </a>

      <a routerLink="/dashboard/usuarios" 
         routerLinkActive="bg-[#2A3445] text-white border-l-4 border-blue-500 shadow-sm"
         class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-r-lg transition-colors border-l-4 border-transparent">
        <span class="material-icons text-sm">group</span>
        <span class="font-medium text-sm">Usuarios</span>
      </a>

      <div class="pt-4 mt-4 border-t border-slate-700/50">
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-r-lg transition-colors border-l-4 border-transparent">
          <span class="material-icons text-sm">settings</span>
          <span class="font-medium text-sm">Configuración</span>
        </a>
        
        <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-r-lg transition-colors text-left border-l-4 border-transparent">
          <span class="material-icons text-sm">logout</span>
          <span class="font-medium text-sm">Salir</span>
        </button>
      </div>
    </nav>
  </aside>

  <main class="flex-1 p-8 ml-0 md:ml-64 w-full transition-all duration-300">
    <router-outlet></router-outlet>
  </main>

</div>
